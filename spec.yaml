id: test_dashboard

requirements:
  - name: ecoscope-platform
    version: 2.18.0
    channel: https://repo.prefix.dev/ecoscope-workflows/
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

rjsf-overrides:
  properties:
    get_events_data.properties.event_types.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: event_type
          depends_on: properties.er_client_name.properties.data_source.properties.name
    groupers.properties.groupers.ecoscope:transform:
      - transformer: EarthRangerEnumResolver
        transformer_kws:
          type: spatial_feature_group
          depends_on: properties.er_client_name.properties.data_source.properties.name
  $defs:
    ValueGrouper.properties.index_name.oneOf:
      - const: event_category
        title: Event Type Category
      - const: event_type
        title: Event Type
      - const: reported_by_name
        title: Reported By Name
  uiSchema:
    groupers.groupers.items.anyOf:
      - ui:options:
          label: false
      - ui:options:
          label: false
      - ui:options:
          label: false
    get_events_data.event_types.ui:options.displayLabel: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details
  - name: Data Source
    id: er_client_name
    task: set_er_connection
  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: '%d %b %Y %H:%M:%S'

  - name: Event Types
    id: get_events_data
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - event_type
        - event_category
        - serial_number
        - geometry
      raise_on_empty: false
      include_details: false
      include_updates: false
      include_related_events: false
      include_display_values: true

  - name: Extract Timezone Selection
    id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}
  - name: Convert to timezone
    id: convert_to_user_timezone
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.get_events_data.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - time

  - name: Group Data
    id: groupers
    task: set_groupers

  - name: Add temporal index to Events
    id: events_add_temporal_index
    task: add_temporal_index
    partial:
      df: ${{ workflow.convert_to_user_timezone.return }}
      time_col: time
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed

  - name: Events Colormap
    id: events_colormap
    task: apply_color_map
    partial:
      df: ${{ workflow.events_add_temporal_index.return }}
      input_column_name: event_type
      colormap: tab20b
      output_column_name: event_type_colormap
  
  ### File persistence - ungrouped
  - name: Persist DF 
    id: persist_events
    task: persist_df
    partial:
      df: ${{ workflow.events_colormap.return }}
      filename: "ungrouped"
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv

  - id: ungrouped_files_list
    task: create_files_single_view
    partial:
      files: 
        - ${{ workflow.persist_events.return }}
      view: null
    skipif:
      conditions:
        - never

  ### Map ungrouped
  - name: Create map layer from grouped Events
    id: events_map_layer
    task: create_point_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      layer_style:
        fill_color_column: event_type_colormap
        get_radius: 5
      legend:
        label_column: event_type_display
        color_column: event_type_colormap
      tooltip_columns: null
      geodataframe: ${{ workflow.events_colormap.return }}

  - name: Draw Ecomap from grouped Events
    id: events_ecomap
    task: draw_ecomap
    partial:
      title: null
      tile_layers:
        - layer_name: "TERRAIN"
      north_arrow_style:
        placement: top-left
      legend_style:
        title: Event Type
        format_title: false
        placement: bottom-right
      static: false
      max_zoom: 20
      widget_id: "Events Map Ungrouped"
      geo_layers: ${{ workflow.events_map_layer.return }}
  - name: Persist grouped Events Ecomap as Text
    id: events_ecomap_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: v2
      text: ${{ workflow.events_ecomap.return }}
  - name: Create grouped Events Map Widget
    id: ungrouped_events_map_widget
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: "Events Map Ungrouped"
      view: null
      data: ${{ workflow.events_ecomap_html_url.return }}


  ### Split into groups
  - name: Split Events by Group
    id: split_event_groups
    task: split_groups
    partial:
      df: ${{ workflow.events_colormap.return }}
      groupers: ${{ workflow.groupers.return }}

  ### File persistence - grouped
  - name: Persist DF 
    id: persist_grouped_events
    task: persist_df
    partial:
      filename: null
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filetype: csv
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.split_event_groups.return }}

  - id: grouped_files_list
    task: create_files_single_view
    map:
      argnames: [view, files]
      argvalues: ${{ workflow.persist_grouped_events.return }}
    skipif:
      conditions:
        - never
  - name: Merge Files
    id: merge_grouped_files_list
    task: merge_file_views
    partial:
      files: ${{ workflow.grouped_files_list.return }}

  ### Grouped map
  - name: Create map layer from grouped Events
    id: grouped_events_map_layer
    task: create_point_layer
    skipif:
      conditions:
        - any_is_empty_df
        - any_dependency_skipped
        - all_geometry_are_none
    partial:
      layer_style:
        fill_color_column: event_type_colormap
        get_radius: 5
      legend:
        label_column: event_type_display
        color_column: event_type_colormap
      tooltip_columns: null
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.split_event_groups.return }}

  - name: Draw Ecomap from grouped Events
    id: grouped_events_ecomap
    task: draw_ecomap
    partial:
      title: null
      tile_layers:
        - layer_name: "TERRAIN"
      north_arrow_style:
        placement: top-left
      legend_style:
        title: Event Type
        format_title: false
        placement: bottom-right
      static: false
      max_zoom: 20
      widget_id: Grouped Events Map
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.grouped_events_map_layer.return }}
  - name: Persist grouped Events Ecomap as Text
    id: grouped_events_ecomap_html_url
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: v2
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.grouped_events_ecomap.return }}
  - name: Create grouped Events Map Widget
    id: grouped_events_map_widget
    task: create_map_widget_single_view
    skipif:
      conditions:
        - never
    partial:
      title: Grouped Events Map
    map:
      argnames:
        - view
        - data
      argvalues: ${{ workflow.grouped_events_ecomap_html_url.return }}
  - name: Merge Events Map Widget Views
    id: grouped_events_map_widget_merge
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.grouped_events_map_widget.return }}

  - name: Create Dashboard with Map Widgets
    id: events_dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.ungrouped_events_map_widget.return }}  
        - ${{ workflow.grouped_events_map_widget_merge.return }}
      files:
        - ${{ workflow.ungrouped_files_list.return }}
        - ${{ workflow.merge_grouped_files_list.return }}
      groupers: ${{ workflow.groupers.return }}
      time_range: ${{ workflow.time_range.return }}
